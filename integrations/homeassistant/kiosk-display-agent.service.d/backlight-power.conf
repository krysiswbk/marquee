[Service]
# The agent runs as wbk (a member of video). sysfs resets these permissions
# on boot, so grant the narrow backlight-power write on each service start.
ExecStartPre=+/usr/bin/chgrp video /sys/class/backlight/intel_backlight/bl_power
ExecStartPre=+/usr/bin/chmod g+w /sys/class/backlight/intel_backlight/bl_power
