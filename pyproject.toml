[tool.ruff]
target-version = "py313"
line-length = 110
include = ["cast/marquee/attention/**/*.py", "cast/marquee/signals/**/*.py", "cast/marquee/context/**/*.py", "cast/marquee/api/attention.py", "tests/test_attention*.py"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.13"
strict = true
follow_imports = "silent"
files = ["cast/marquee/attention", "cast/marquee/signals", "cast/marquee/context", "cast/marquee/api/attention.py"]
